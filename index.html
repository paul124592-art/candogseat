    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What should I do if my dog ate chocolate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Call your vet right away, or ASPCA Animal Poison Control at (888) 426-4435 in the US. Tell them what kind of chocolate your dog ate, how much, and when. Do not wait for symptoms, and do not try to make your dog vomit unless a vet tells you to. Dark and baking chocolate are the most dangerous; milk chocolate is less toxic but still a reason to call."
            }
          },
          {
            "@type": "Question",
            "name": "Are all grapes toxic to dogs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Grapes, raisins, currants, and sultanas can all cause sudden kidney failure in dogs, and no amount has been proved safe. Even a few grapes can be dangerous, and the toxic dose varies from dog to dog, so any amount is a reason to call your vet immediately."
            }
          },
          {
            "@type": "Question",
            "name": "Can dogs eat peanut butter?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, as long as it does not contain xylitol (also sold as birch sugar). Plain peanut butter with no added sweetener is safe in small amounts. Always check the label — some sugar-free peanut butters use xylitol, which is extremely toxic to dogs and can cause a dangerous drop in blood sugar and liver failure."
            }
          },
          {
            "@type": "Question",
            "name": "Can dogs eat avocado?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is best to avoid avocado. The pit, skin, and leaves contain persin, a toxin that can cause vomiting and diarrhea in dogs, and the pit is also a choking and blockage hazard. The flesh is very high in fat, which can upset your dog's stomach and, in larger amounts, trigger pancreatitis."
            }
          },
          {
            "@type": "Question",
            "name": "How much people food can my dog have?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Treats — including any safe people food — should make up no more than about 10% of your dog's daily calories. The other 90% should come from a complete and balanced dog food. Even safe foods should be served plain, without seasoning, sauces, bones, or added salt and sugar."
            }
          },
          {
            "@type": "Question",
            "name": "Is this a substitute for vet advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. CanDogsEat gives general guidance based on published veterinary advice from the ASPCA and the American Kennel Club. Every dog is different, and puppies, small dogs, and dogs with health conditions can react differently. If your dog eats something toxic or seems unwell, contact your vet immediately."
            }
          }
        ]
      }
